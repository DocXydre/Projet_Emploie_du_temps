# Le projet Xcode de l'appli Coach Santé, décrit pour XcodeGen.
#
#   brew install xcodegen
#   cd ios/CoachSante && xcodegen
#   open CoachSante.xcodeproj
#
# Le .xcodeproj se régénère à partir de ce fichier : c'est lui qu'on modifie.

name: CoachSante
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CoachSante:
    type: application
    platform: iOS
    sources:
      - CoachSante
    settings:
      base:
        # Unique chez Apple. Si Xcode dit qu'il est déjà pris, change la fin.
        PRODUCT_BUNDLE_IDENTIFIER: fr.docxydre.coachsante
        PRODUCT_NAME: CoachSante
        CODE_SIGN_STYLE: Automatic
        # Ton équipe (« Personal Team ») se choisit dans Xcode, onglet
        # Signing & Capabilities. Elle n'est pas écrite ici.
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: CoachSante/Info.plist
      properties:
        CFBundleDisplayName: Coach Santé
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: >-
          Coach Santé lit tes pas, ta fréquence cardiaque de repos, ta variabilité
          cardiaque, ton sommeil et tes séances pour les envoyer à ton coach.
        NSHealthUpdateUsageDescription: Coach Santé n'écrit rien dans Santé.
        NSLocalNetworkUsageDescription: >-
          Pour joindre ton serveur sur le Wi-Fi de la maison pendant les essais.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [fr.docxydre.coachsante.synchro]
    entitlements:
      path: CoachSante/CoachSante.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
