# Pile locale.
#
#   docker compose up -d
#   ./sql/appliquer.sh            applique les migrations
#
# Les fichiers de sql/ ne sont pas montés dans docker-entrypoint-initdb.d :
# on veut pouvoir les rejouer sur une base existante, pas seulement à la
# création du volume.

services:
  db:
    image: postgres:16-alpine
    container_name: planif-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planif}
      POSTGRES_USER: ${POSTGRES_USER:-planif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe requis dans .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - donnees:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planif}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: planif-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Tout le .env entre dans le conteneur. Avant, chaque réglage devait être
    # recopié ici à la main, et un oubli ne se voyait pas : le réglage gardait
    # sa valeur par défaut sans rien dire. Quatorze étaient dans ce cas, dont
    # toute la deuxième boîte aux lettres. Les valeurs par défaut vivent dans
    # api/config.py, à un seul endroit.
    env_file:
      - .env
    environment:
      # Seules exceptions : ce qui n'a pas la même valeur dedans et dehors. Le
      # .env décrit la machine, où la base s'appelle localhost et peut écouter
      # sur un autre port ; dans le réseau Docker elle s'appelle « db ». Ces
      # lignes passent après env_file et l'emportent.
      DB_HOTE: db
      DB_PORT: 5432
      TZ: UTC
    ports:
      # Par défaut l'API n'écoute que sur la machine. Mettre API_BIND=0.0.0.0
      # dans .env pour l'atteindre depuis le téléphone, sur le réseau local.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"

volumes:
  donnees:
