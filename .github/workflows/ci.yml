name: Integration continue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coeur:
    name: Coeur metier (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coeur
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilation et tests
        run: mvn -B verify

      - name: Publication du rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-coeur
          path: coeur/target/surefire-reports/
          if-no-files-found: ignore

  integration:
    name: Tests d'integration (PostgreSQL reel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coeur
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: planif
          POSTGRES_USER: planif
          POSTGRES_PASSWORD: planif
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planif"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Verifie ce qu'aucun test unitaire ne peut voir : que les migrations
      # Flyway et le mapping JPA restent coherents (ddl-auto: validate).
      - name: Migrations et parcours complet
        run: mvn -B -Pintegration verify
        env:
          DB_HOTE: localhost
          DB_PORT: 5432
          POSTGRES_DB: planif
          POSTGRES_USER: planif
          POSTGRES_PASSWORD: planif

  collecteurs:
    name: Collecteurs (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collecteurs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installation
        run: pip install -e ".[dev]"

      - name: Analyse statique
        run: ruff check .

      - name: Tests
        run: pytest -q

  images:
    name: Construction des images
    runs-on: ubuntu-latest
    needs: [coeur, integration, collecteurs]
    steps:
      - uses: actions/checkout@v4

      - name: Verification de la pile Compose
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: verification

      - name: Image du coeur metier
        run: docker build -t planif-coeur:${{ github.sha }} ./coeur

      - name: Image des collecteurs
        run: docker build -t planif-collecteurs:${{ github.sha }} ./collecteurs

  # Le deploiement vers le mini PC sera ajoute au moment de la mise en service
  # de la machine (SSH via Tailscale, puis `docker compose up -d --build`).
