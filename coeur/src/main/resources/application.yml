spring:
  application:
    name: planif-coeur
  datasource:
    url: jdbc:postgresql://${DB_HOTE:localhost}:${DB_PORT:5432}/${POSTGRES_DB:planif}
    username: ${POSTGRES_USER:planif}
    password: ${POSTGRES_PASSWORD:planif}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${COEUR_PORT:8080}
  error:
    whitelabel:
      enabled: false
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /documentation

logging:
  pattern:
    level: "%5p [%X{correlation:-}]"
  level:
    fr.thomasmathis.planif: INFO

planif:
  # Remplace a la construction par Maven (filtrage de ressources).
  version: "@project.version@"
  fuseau-affichage: Europe/Paris
  # Horizon glissant du moteur de planification, en jours (cf. 6.2).
  horizon-jours: 21
  erreurs:
    # Le detail technique n'est expose qu'en developpement.
    exposer-detail: false
  securite:
    # Obligatoire, au moins 32 caracteres. Generer : openssl rand -base64 48
    secret-jwt: ${PLANIF_SECRET_JWT}
    duree-acces-minutes: 30
    duree-rafraichissement-jours: 30
  comptes:
    # Les comptes sont crees au premier demarrage si ces variables sont fournies.
    # Aucun mot de passe par defaut : sans variable, le compte n'est pas cree.
    admin:
      identifiant: ${PLANIF_ADMIN_IDENTIFIANT:thomas}
      mot-de-passe: ${PLANIF_ADMIN_MOT_DE_PASSE:}
    standard:
      identifiant: ${PLANIF_STANDARD_IDENTIFIANT:lorette}
      mot-de-passe: ${PLANIF_STANDARD_MOT_DE_PASSE:}

---
spring:
  config:
    activate:
      on-profile: dev

planif:
  erreurs:
    exposer-detail: true

logging:
  level:
    fr.thomasmathis.planif: DEBUG
    org.flywaydb: DEBUG
