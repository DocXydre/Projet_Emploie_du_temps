# Le projet Xcode de l'appli HAL, décrit pour XcodeGen.
#
#   brew install xcodegen
#   cd ios/HAL && xcodegen
#   open HAL.xcodeproj
#
# Le .xcodeproj se régénère à partir de ce fichier : c'est lui qu'on modifie.

name: HAL
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# L'adresse du serveur du foyer, intégrée à l'appli (voir Configuration.xcconfig).
configFiles:
  Debug: Configuration.xcconfig
  Release: Configuration.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # L'équipe de signature, pour l'appli et ses widgets : plus besoin de la
    # rechoisir dans Xcode après chaque xcodegen. Ce n'est pas un secret.
    DEVELOPMENT_TEAM: 587234DKU2
    CODE_SIGN_STYLE: Automatic
targets:
  HAL:
    type: application
    platform: iOS
    sources:
      - HAL
      # Ce que l'appli partage avec ses widgets : l'instantané et la Live Activity.
      - Partage
    dependencies:
      - target: HALWidgets
        embed: true
    # Un schéma partagé, pour archiver en ligne de commande (outils/testflight.sh).
    scheme: {}
    settings:
      base:
        # Unique chez Apple. Si Xcode dit qu'il est déjà pris, change la fin.
        PRODUCT_BUNDLE_IDENTIFIER: fr.docxydre.hal
        PRODUCT_NAME: HAL
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # THM-3 : l'icône suit le duo choisi (outils/icones_duos.swift les dessine).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: >-
          AppIcon-RosePrune AppIcon-ForetCitron AppIcon-MentheLilas AppIcon-OceanIndigo AppIcon-NeigeArdoise
        # Le corail d'origine pour ce qu'iOS dessine seul (alertes, sélecteurs) avant le duo.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: HAL/Info.plist
      properties:
        CFBundleDisplayName: HAL
        # L'adresse du serveur, lue par Session.serveurIntegre : rien à taper.
        HALServeur: $(HAL_SERVEUR)
        # L'appli n'existe qu'en français : les dates et les nombres suivent,
        # même sur un iPhone réglé dans une autre langue.
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # TestFlight : seulement du HTTPS, chiffrement exempté. Évite la question
        # à chaque envoi.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: FondLancement
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSPhotoLibraryUsageDescription: >-
          HAL utilise la photo que tu choisis comme fond de l'appli.
        # SAN-10 : Santé est lue toute seule, rien n'y est écrit.
        NSHealthShareUsageDescription: >-
          HAL lit tes pas, ta fréquence cardiaque, ta variabilité cardiaque, ta
          VO2max, ton poids, ton sommeil, tes séances avec leur détail et leur
          tracé, pour adapter ton plan. Tout reste sur ton serveur.
        NSHealthUpdateUsageDescription: HAL n'écrit rien dans Santé.
        # POS-1 : un cercle autour de chaque lieu connu, même appli fermée.
        NSLocationWhenInUseUsageDescription: >-
          HAL reconnaît les lieux que tu lui as donnés (le foyer, la salle, l'école)
          pour calculer tes trajets et savoir si tu es parti.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          HAL surveille un cercle de 50 m autour de tes lieux, même appli fermée,
          pour savoir où tu es. Le serveur garde le lieu, jamais tes trajets.
        # ORB-5 : la dictée, dans le panneau de HAL.
        NSMicrophoneUsageDescription: >-
          Le micro sert à dicter tes messages à HAL, seulement quand tu le demandes.
        NSSpeechRecognitionUsageDescription: >-
          Ta voix est transcrite en texte pour écrire ton message à HAL.
        # IOS-3 : la séance en cours sur l'écran verrouillé et dans la Dynamic Island.
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [fr.docxydre.hal.sante, fr.docxydre.hal.sante.historique]
        # 5.18 : la page d'un lien d'invitation ouvre l'appli par hal://rejoindre.
        CFBundleURLTypes:
          - CFBundleURLName: fr.docxydre.hal
            CFBundleURLSchemes: [hal]
    entitlements:
      path: HAL/HAL.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # IOS-1 : le dossier que l'appli partage avec ses widgets.
        com.apple.security.application-groups: [group.fr.docxydre.hal.partage]
        # NOT-16 : les notifications envoyées par le serveur, par le service
        # d'Apple. Une appli distribuée par TestFlight passe seule en production.
        aps-environment: development
        # CNX-7 : se connecter avec Apple.
        com.apple.developer.applesignin: [Default]

  # IOS-1 à IOS-3 : les widgets de l'écran d'accueil et de l'écran verrouillé, et
  # la Live Activity de la séance. Ils lisent ce que l'appli a gardé, sans appel
  # au serveur.
  HALWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HALWidgets
      - Partage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.docxydre.hal.widgets
        PRODUCT_NAME: HALWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: HALWidgets/Info.plist
      properties:
        CFBundleDisplayName: HAL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HALWidgets/HALWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.docxydre.hal.partage]
